name: 'KLRNBK-DiscordId'
version: '@version@'
main: nl.klrnbk.minecraft.plugins.discordId.paper.MCPluginMain
bootstrapper: nl.klrnbk.minecraft.plugins.discordId.paper.MCPluginBootstrap

api-version: '26.2'
author: ijsKoud <daan@klrnbk.nl>
description: Allows players to link their Discord account to their Minecraft account.

dependencies:
  server:
    KLRNBK-Shared-Runtime:
      load: BEFORE
      required: true
      join-classpath: true
    # Identity registers the IdentityProvider instance this plugin reads, so it has to be enabled first.
    # join-classpath makes the Identity API classes (bundled in the Identity jar) visible to this plugin.
    KLRNBK-Identity:
      load: BEFORE
      required: true
      join-classpath: true
